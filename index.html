<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Listening Before Birth | Najla Saad Almotiri</title>
    <meta name="description" content="Browser-based research presentation reviewing Rene et al. (2025) on prenatal linguistic exposure and newborn brain responses.">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' x2='1' y1='0' y2='1'%3E%3Cstop stop-color='%23102A24'/%3E%3Cstop offset='.68' stop-color='%23123C33'/%3E%3Cstop offset='1' stop-color='%23B68E1D'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Cpath d='M18 35c10-18 18-18 28 0' fill='none' stroke='white' stroke-width='5' stroke-linecap='round'/%3E%3Cpath d='M22 38c7-11 13-11 20 0' fill='none' stroke='%23E6D6A1' stroke-width='4' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='43' r='4' fill='%23E6D6A1'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <a class="skip-link" href="#slide">Skip to slide</a>
    <div class="app-shell">
      <header class="topbar" aria-label="Presentation controls">
        <div class="brand">
          <strong>Listening Before Birth</strong>
          <span>Najla Saad Almotiri</span>
        </div>
        <div class="top-actions">
          <button id="overviewBtn" type="button" title="Open slide overview" aria-haspopup="dialog">Overview</button>
          <button id="notesBtn" type="button" title="Toggle rehearsal mode">Rehearse</button>
          <button id="spotlightBtn" type="button" title="Toggle pointer spotlight" aria-pressed="false">Spotlight</button>
          <button id="fullscreenBtn" type="button" title="Enter fullscreen">Fullscreen</button>
        </div>
      </header>

      <main class="stage-wrap">
        <section id="slide" class="slide" tabindex="-1" aria-live="polite"></section>
      </main>

      <aside id="notesPanel" class="notes-panel" aria-label="Presenter notes" hidden>
        <div class="notes-head">
          <strong>Rehearsal notes</strong>
          <span id="timer">00:00</span>
        </div>
        <div id="notesContent"></div>
      </aside>

      <footer class="controlbar">
        <button id="prevBtn" type="button" aria-label="Previous slide">Previous</button>
        <div class="progress-wrap" aria-hidden="true"><div id="progressBar"></div></div>
        <span id="slideCount" class="slide-count"></span>
        <button id="nextBtn" type="button" aria-label="Next slide">Next</button>
      </footer>
    </div>

    <div id="overviewDialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="overviewTitle" hidden>
      <div class="dialog-card overview-card">
        <div class="dialog-head">
          <h2 id="overviewTitle">Slide overview</h2>
          <button class="icon-btn" id="closeOverview" type="button" aria-label="Close overview">x</button>
        </div>
        <div id="overviewGrid" class="overview-grid"></div>
      </div>
    </div>

    <div id="figureDialog" class="dialog" role="dialog" aria-modal="true" aria-label="Enlarged figure" hidden>
      <div class="dialog-card figure-card">
        <button class="icon-btn figure-close" id="closeFigure" type="button" aria-label="Close enlarged figure">x</button>
        <img id="figureImg" alt="">
        <p id="figureCaption"></p>
      </div>
    </div>

    <div id="spotlight" aria-hidden="true"></div>
    <div id="printDeck" aria-hidden="true"></div>

    <script src="slides-data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
